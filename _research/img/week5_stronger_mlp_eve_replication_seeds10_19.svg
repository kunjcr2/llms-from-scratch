<text x="55" y="1047" fill="#596779" font-size="14" font-weight="400" text-anchor="start">Fresh attacker: mean of 3 starts after 20,000 updates; 65,536 held-out messages per pair.</text>
<text x="55" y="1072" fill="#596779" font-size="14" font-weight="400" text-anchor="start">Higher attacker accuracy means more leakage. Failed Bob pairs have no attack comparison.</text>
