<text x="535" y="402" font-size="17" font-weight="650"><tspan fill="#356AA2">73.5%</tspan><tspan fill="#9CA9B6"> → </tspan><tspan fill="#DB8431">69.4%</tspan></text>
<text x="965" y="402" fill="#248675" font-size="18" font-weight="750" text-anchor="start">-4.1 pp</text>
