<text x="195" y="762" font-size="17" font-weight="650"><tspan fill="#356AA2">99.99%</tspan><tspan fill="#9CA9B6"> → </tspan><tspan fill="#DB8431">99.98%</tspan></text>
<text x="535" y="762" font-size="17" font-weight="650"><tspan fill="#356AA2">72.9%</tspan><tspan fill="#9CA9B6"> → </tspan><tspan fill="#DB8431">77.7%</tspan></text>
<text x="965" y="762" fill="#B35C44" font-size="18" font-weight="750" text-anchor="start">+4.7 pp</text>
<rect x="52" y="794" width="1096" height="65" rx="12" fill="#FFFFFF" stroke="#E9EDF2"/>
<text x="74" y="835" fill="#182330" font-size="19" font-weight="750" text-anchor="start">Seed 17</text>
<text x="195" y="834" font-size="17" font-weight="650"><tspan fill="#356AA2">99.95%</tspan><tspan fill="#9CA9B6"> → </tspan><tspan fill="#DB8431">99.98%</tspan></text>
<text x="535" y="834" font-size="17" font-weight="650"><tspan fill="#356AA2">70.0%</tspan><tspan fill="#9CA9B6"> → </tspan><tspan fill="#DB8431">68.6%</tspan></text>
<text x="965" y="834" fill="#248675" font-size="18" font-weight="750" text-anchor="start">-1.4 pp</text>
<rect x="52" y="866" width="1096" height="65" rx="12" fill="#FFFFFF" stroke="#E9EDF2"/>
<text x="74" y="907" fill="#182330" font-size="19" font-weight="750" text-anchor="start">Seed 18</text>
