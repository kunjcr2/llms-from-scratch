<text x="535" y="618" font-size="17" font-weight="650"><tspan fill="#356AA2">72.3%</tspan><tspan fill="#9CA9B6"> → </tspan><tspan fill="#596779">skipped</tspan></text>
<text x="965" y="618" fill="#B35C44" font-size="17" font-weight="700" text-anchor="start">Bob failed</text>
