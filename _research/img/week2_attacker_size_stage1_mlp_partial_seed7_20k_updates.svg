    .subtitle { font-size: 17px; fill: #60655f; }
    .axis-title { font-size: 15px; font-weight: 700; fill: #555b53; }
    .tick { font-size: 15px; font-weight: 600; fill: #777c74; }
    .grid { stroke: #d9d8cf; stroke-width: 1; }
