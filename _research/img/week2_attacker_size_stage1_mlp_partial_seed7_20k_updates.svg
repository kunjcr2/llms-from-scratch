<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">Fresh-attacker recovery after 20,000 updates</title>
  <desc id="description">Week 2 · Stage 1 Eve: MLP · pair seed 7 · Bob reached 87.5% (unreliable). The chart compares fresh CNN, MLP, BiLSTM, and Transformer attackers across target parameter counts.</desc>
