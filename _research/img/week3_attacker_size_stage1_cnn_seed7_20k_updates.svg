<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">Fresh-attacker recovery after 20,000 updates</title>
  <desc id="description">Week 3 · Stage 1 Eve: CNN · pair seed 7 · Bob passed reliability. The chart compares fresh CNN, MLP, BiLSTM, and Transformer attackers across target parameter counts.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #1f211d; }
    .kicker { font-size: 14px; font-weight: 700; fill: #6b7068; letter-spacing: 1.2px; }
    .title { font-size: 32px; font-weight: 700; letter-spacing: -0.4px; }
    .subtitle { font-size: 17px; fill: #60655f; }
    .axis-title { font-size: 15px; font-weight: 700; fill: #555b53; }
    .tick { font-size: 15px; font-weight: 600; fill: #777c74; }
    .grid { stroke: #d9d8cf; stroke-width: 1; }
    .x-guide { stroke: #e7e5dc; stroke-width: 1; }
    .chance { stroke: #8c8f87; stroke-width: 2; stroke-dasharray: 7 6; }
    .series { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .error { fill: none; stroke-width: 2; stroke-linecap: round; }
    .dot { stroke: #f8f7ef; stroke-width: 2; r: 6; }
    .label-link { fill: none; stroke-width: 2; opacity: 0.75; }
    .end-label { font-size: 16px; }
    .note, .incomplete { font-size: 13px; fill: #767a72; }
  </style>
