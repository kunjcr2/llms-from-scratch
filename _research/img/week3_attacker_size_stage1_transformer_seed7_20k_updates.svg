    .x-guide { stroke: #e7e5dc; stroke-width: 1; }
    .chance { stroke: #8c8f87; stroke-width: 2; stroke-dasharray: 7 6; }
    .series { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .error { fill: none; stroke-width: 2; stroke-linecap: round; }
    .dot { stroke: #f8f7ef; stroke-width: 2; r: 6; }
    .label-link { fill: none; stroke-width: 2; opacity: 0.75; }
    .end-label { font-size: 16px; }
