<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">Fresh-attacker recovery after 20,000 updates</title>
  <desc id="description">Week 3, pair seed 7, Stage-1 Transformer Eve with 39,601 parameters. Fresh CNN, MLP, and Transformer attackers are compared by size. Bob meets the project's 96 percent reliability criterion.</desc>
